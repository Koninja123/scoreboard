<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b5394">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hockey Scoreboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Mobiele scheidsrechter app</p>
        <h1>Hockey Scoreboard</h1>
      </div>
      <button id="new-match-button" class="ghost-button" type="button">Nieuwe wedstrijd</button>
    </header>

    <section class="setup-card" aria-labelledby="setup-heading">
      <div class="setup-header">
        <div>
          <p class="eyebrow">Instellingen</p>
          <h2 id="setup-heading">Wedstrijd instellen</h2>
        </div>
        <button id="toggle-setup-button" class="ghost-button" type="button" aria-expanded="true" aria-controls="setup-content">Verberg</button>
      </div>

      <div id="setup-content" class="setup-content">
        <form id="settings-form" class="settings-grid">
          <label class="field">
            <span>Blauw team</span>
            <input id="team-blue-name" name="teamBlueName" type="text" maxlength="24" placeholder="Blauw team" required>
          </label>

          <label class="field">
            <span>Rood team</span>
            <input id="team-red-name" name="teamRedName" type="text" maxlength="24" placeholder="Rood team" required>
          </label>

          <fieldset class="field timer-presets">
            <legend>Speeltijd</legend>
            <div class="preset-row">
              <button class="preset-button" type="button" data-minutes="15">15 min</button>
              <button class="preset-button" type="button" data-minutes="30">30 min</button>
              <label class="custom-duration">
                <span>Vrij</span>
                <input id="custom-minutes" type="number" min="1" max="120" step="1" inputmode="numeric" value="35">
              </label>
            </div>
          </fieldset>

          <div class="form-actions">
            <button class="primary-button" type="submit">Instellingen opslaan</button>
            <button id="apply-custom-time" class="secondary-button" type="button">Vrije tijd instellen</button>
          </div>
        </form>
      </div>
    </section>

    <section class="match-layout" aria-label="Scorebord">
      <article class="team-panel team-blue" aria-labelledby="team-blue-display">
        <p class="team-label">Blauw</p>
        <h2 id="team-blue-display" class="team-name">Blauw team</h2>
        <p id="team-blue-score" class="team-score" aria-live="polite">0</p>
        <div class="score-controls">
          <button class="score-button" type="button" data-team="blue" data-delta="-1">-1</button>
          <button class="score-button positive" type="button" data-team="blue" data-delta="1">+1</button>
        </div>
      </article>

      <section class="timer-panel" aria-labelledby="timer-heading">
        <div>
          <p class="eyebrow">Wedstrijdklok</p>
          <h2 id="timer-heading">Aftellen</h2>
        </div>

        <div id="time-up-banner" class="time-up-banner" hidden>
          Tijd verstreken
        </div>

        <p id="timer-display" class="timer-display">15:00</p>
        <p id="timer-status" class="timer-status" aria-live="polite">Klaar om te starten</p>

        <div class="timer-actions">
          <button id="start-button" class="primary-button" type="button">Start</button>
          <button id="pause-button" class="secondary-button" type="button">Pauze</button>
          <button id="reset-button" class="ghost-button" type="button">Reset</button>
        </div>
      </section>

      <article class="team-panel team-red" aria-labelledby="team-red-display">
        <p class="team-label">Rood</p>
        <h2 id="team-red-display" class="team-name">Rood team</h2>
        <p id="team-red-score" class="team-score" aria-live="polite">0</p>
        <div class="score-controls">
          <button class="score-button" type="button" data-team="red" data-delta="-1">-1</button>
          <button class="score-button positive" type="button" data-team="red" data-delta="1">+1</button>
        </div>
      </article>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
