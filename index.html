<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b5394">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hockey Scoreboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="board" id="board">
    <section class="team team--blue">
      <button class="team__tap" type="button" data-team="blue" aria-label="Doelpunt voor blauw team">
        <span class="team__label">Blauw</span>
        <span class="team__name" id="blue-name">Blauw team</span>
        <span class="team__score" id="blue-score" aria-live="polite">0</span>
        <span class="team__hint">tik = +1</span>
      </button>
      <button class="team__minus" type="button" data-team="blue" aria-label="Doelpunt eraf bij blauw team">&minus;1</button>
    </section>

    <section class="team team--red">
      <button class="team__tap" type="button" data-team="red" aria-label="Doelpunt voor rood team">
        <span class="team__label">Rood</span>
        <span class="team__name" id="red-name">Rood team</span>
        <span class="team__score" id="red-score" aria-live="polite">0</span>
        <span class="team__hint">tik = +1</span>
      </button>
      <button class="team__minus" type="button" data-team="red" aria-label="Doelpunt eraf bij rood team">&minus;1</button>
    </section>

    <div class="clock" id="clock" data-state="idle">
      <button class="clock__lock" id="lock-btn" type="button" aria-label="Veld-modus: scherm vergrendelen">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 1.7A4.3 4.3 0 0 0 7.7 6v3H6.5A1.8 1.8 0 0 0 4.7 10.8v8.4A1.8 1.8 0 0 0 6.5 21h11a1.8 1.8 0 0 0 1.8-1.8v-8.4A1.8 1.8 0 0 0 17.5 9h-1.2V6A4.3 4.3 0 0 0 12 1.7Zm2.3 7.3H9.7V6a2.3 2.3 0 0 1 4.6 0v3Z"/></svg>
      </button>
      <span class="clock__period" id="period-badge" hidden>H1</span>
      <button class="clock__time" id="clock-time" type="button" aria-label="Start of pauzeer de wedstrijdklok">15:00</button>
      <button class="clock__gear" id="open-settings" type="button" aria-label="Instellingen openen">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/>
          <path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 .06-1 7.6 7.6 0 0 0-.06-1l2-1.6a.5.5 0 0 0 .12-.62l-1.9-3.3a.5.5 0 0 0-.6-.22l-2.4.96a7 7 0 0 0-1.7-1l-.36-2.5a.5.5 0 0 0-.5-.42h-3.8a.5.5 0 0 0-.5.42l-.36 2.5a7 7 0 0 0-1.7 1l-2.4-.96a.5.5 0 0 0-.6.22l-1.9 3.3a.5.5 0 0 0 .12.63l2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.12.62l1.9 3.3a.5.5 0 0 0 .6.22l2.4-.96a7 7 0 0 0 1.7 1l.36 2.5a.5.5 0 0 0 .5.42h3.8a.5.5 0 0 0 .5-.42l.36-2.5a7 7 0 0 0 1.7-1l2.4.96a.5.5 0 0 0 .6-.22l1.9-3.3a.5.5 0 0 0-.12-.62l-2-1.6Z" opacity=".85"/>
        </svg>
      </button>
    </div>

    <p class="status" id="status" aria-live="polite">Tik op de tijd om te starten</p>
  </main>

  <button class="undo-btn" id="undo-btn" type="button" hidden aria-label="Laatste score ongedaan maken">
    &#8617; Ongedaan
  </button>

  <div class="lock-overlay" id="lock-overlay" hidden>
    <div class="lock-overlay__panel">
      <p class="lock-overlay__title">Veld-modus actief</p>
      <button class="lock-overlay__unlock" id="unlock-btn" type="button" aria-label="Houd ingedrukt om te ontgrendelen">
        <span class="lock-overlay__ring"></span>
        <svg class="lock-overlay__icon" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 1.7A4.3 4.3 0 0 0 7.7 6v3H6.5A1.8 1.8 0 0 0 4.7 10.8v8.4A1.8 1.8 0 0 0 6.5 21h11a1.8 1.8 0 0 0 1.8-1.8v-8.4A1.8 1.8 0 0 0 17.5 9h-1.2V6A4.3 4.3 0 0 0 12 1.7Zm2.3 7.3H9.7V6a2.3 2.3 0 0 1 4.6 0v3Z"/></svg>
      </button>
      <p class="lock-overlay__hint">Houd het slot <strong>1,5 sec ingedrukt</strong> om te ontgrendelen</p>
    </div>
  </div>

  <div class="sheet" id="settings-sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <section class="sheet__panel" role="dialog" aria-modal="true" aria-label="Instellingen">
      <header class="sheet__head">
        <h2>Instellingen</h2>
        <button class="sheet__close" id="close-settings" type="button" aria-label="Sluiten">&times;</button>
      </header>

      <form id="settings-form" class="sheet__form">
        <label class="field">
          <span>Blauw team</span>
          <input id="blue-name-input" type="text" maxlength="20" placeholder="Blauw team" autocomplete="off">
        </label>
        <label class="field">
          <span>Rood team</span>
          <input id="red-name-input" type="text" maxlength="20" placeholder="Rood team" autocomplete="off">
        </label>

        <fieldset class="field presets">
          <legend>Speeltijd (minuten)</legend>
          <div class="presets__row">
            <button class="preset" type="button" data-minutes="15">15</button>
            <button class="preset" type="button" data-minutes="30">30</button>
            <button class="preset" type="button" data-minutes="35">35</button>
            <label class="preset preset--custom">
              <input id="custom-minutes" type="number" min="1" max="120" step="1" inputmode="numeric" value="15" aria-label="Vrije speeltijd in minuten">
            </label>
          </div>
        </fieldset>

        <fieldset class="field presets">
          <legend>Perioden</legend>
          <div class="presets__row presets__row--3">
            <button class="preset period-preset" type="button" data-periods="1">Geen</button>
            <button class="preset period-preset" type="button" data-periods="2">Helften</button>
            <button class="preset period-preset" type="button" data-periods="4">Kwarten</button>
          </div>
        </fieldset>

        <div class="sheet__actions">
          <button class="btn btn--ghost" id="test-alarm" type="button">Alarm testen</button>
          <button class="btn btn--ghost" id="reset-clock" type="button">Klok resetten</button>
          <button class="btn btn--ghost" id="swap-sides" type="button">Wissel kanten</button>
          <button class="btn btn--ghost" id="next-period" type="button" hidden>Volgende periode</button>
          <button class="btn btn--ghost" id="new-match" type="button">Nieuwe wedstrijd</button>
          <button class="btn btn--primary" type="submit">Opslaan &amp; sluiten</button>
        </div>
      </form>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
