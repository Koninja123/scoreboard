name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "styles/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "capacitor.config.json"
      - "tools/copy-web.mjs"
      - "package.json"
      - ".github/workflows/android.yml"
      - "android/app/src/main/**"
      - "android/app/build.gradle"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Dependencies installeren
        run: npm install

      - name: Web-assets bouwen (www/)
        run: node tools/copy-web.mjs

      - name: Capacitor synchroniseren
        run: npx cap sync android

      - name: APK bouwen (release met signing, anders debug)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../hockey-scoreboard.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../hockey-scoreboard.apk
          fi

      - name: APK uploaden (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hockey-scoreboard-apk
          path: hockey-scoreboard.apk
          if-no-files-found: error

      - name: APK als release publiceren (vaste downloadlink)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload android-latest hockey-scoreboard.apk --clobber \
            || gh release create android-latest hockey-scoreboard.apk \
                 --title "Hockey Scoreboard — Android" \
                 --notes "Automatisch bijgewerkte Android-APK. Sta bij de eerste start meldingen toe voor het eindtijd-alarm (werkt met scherm op slot)."
