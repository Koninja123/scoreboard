name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "styles/**"
      - "assets/**"
      - "manifest.webmanifest"
      - "capacitor.config.json"
      - "tools/copy-web.mjs"
      - "package.json"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Dependencies installeren
        run: npm install

      - name: Web-assets bouwen (www/)
        run: node tools/copy-web.mjs

      - name: Capacitor synchroniseren
        run: npx cap sync android

      - name: Debug-APK bouwen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK uploaden (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hockey-scoreboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK als release publiceren (vaste downloadlink)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hockey-scoreboard.apk
          gh release upload android-latest hockey-scoreboard.apk --clobber \
            || gh release create android-latest hockey-scoreboard.apk \
                 --title "Hockey Scoreboard — Android" \
                 --notes "Automatisch bijgewerkte Android-APK. Sta bij de eerste start meldingen toe voor het eindtijd-alarm (werkt met scherm op slot)."
